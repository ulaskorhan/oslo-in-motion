name: Refresh timetable

# Compiles today's and tomorrow's Ruter timetable from Entur so the map can place
# every scheduled vehicle. Runs nightly (Oslo time ~03:15) and can be run by hand.
on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timetable
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build timetable files
        run: python3 tools/build_timetable.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No timetable changes."
          else
            git commit -m "Refresh timetable data"
            git push
          fi
