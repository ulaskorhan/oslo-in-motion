<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Every scheduled Ruter vehicle in Oslo, placed on the map from the day's timetable and Entur realtime data." />
  <title>Oslo in Motion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css?v=2" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17c3-6 5-9 8-9s5 3 8 9"/><circle cx="12" cy="8" r="2.2" fill="currentColor" stroke="none"/></svg></div>
        <div><div class="brand-name">Oslo in Motion</div><div class="brand-sub" id="brand-sub">Ruter network, in motion</div></div>
      </div>
      <div class="head-right">
        <div class="status-pill" id="status-pill" title=""><span class="status-dot" id="status-dot"></span><span id="status-text">Loading timetable…</span></div>
        <div class="language-toggle" role="group" aria-label="Choose language"><button id="lang-en" type="button">EN</button><button id="lang-no" type="button">NO</button></div>
        <div class="clock" id="clock" aria-label="Oslo time">--:--:--</div>
      </div>
    </header>
    <main>
      <aside class="sidebar" id="sidebar">
        <section class="intro">
          <div class="eyebrow" id="eyebrow">Oslo, right now</div>
          <h1 id="main-heading">Every scheduled ride,<br>where it should be.</h1>
          <div class="stat-row" id="stat-row" aria-live="polite"></div>
        </section>

        <section id="detail" class="detail-card" hidden aria-live="polite"></section>

        <section class="card trip-card">
          <label class="field-label" id="destination-title" for="destination-search">Where are you going?</label>
          <div class="field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0C18.5 15.4 12 21 12 21Z"/><circle cx="12" cy="10" r="2.3"/></svg>
            <input id="destination-search" type="search" placeholder="Search a stop or place" autocomplete="off" />
            <button id="destination-clear" class="field-clear" type="button" hidden aria-label="Clear destination">×</button>
          </div>
          <div class="hint" id="destination-status" aria-live="polite">Try Jernbanetorget, Majorstuen or Aker brygge.</div>
          <div class="results" id="destination-results" role="listbox" aria-label="Destination suggestions"></div>
          <div class="destination-routes" id="destination-routes" aria-live="polite"></div>

          <div class="divider"></div>

          <label class="field-label" id="where-title" for="place-search">Where are you?</label>
          <div class="field-row">
            <div class="field">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m15.6 15.6 4.4 4.4" stroke-linecap="round"/></svg>
              <input id="place-search" type="search" placeholder="Enter a place in Oslo" autocomplete="off" />
            </div>
            <button id="locate-me" class="button-secondary" type="button">Use my location</button>
          </div>
          <div class="hint" id="place-status" aria-live="polite">Choose a place or share your location.</div>
          <div class="results" id="place-results" role="listbox" aria-label="Place suggestions"></div>
          <div id="nearby-stops" class="nearby" aria-live="polite"></div>
          <div class="hint fine" id="nearby-privacy" hidden></div>
        </section>

        <section class="lines">
          <div class="lines-head">
            <h2 class="section-title" id="section-title">Lines</h2>
            <div class="count" id="count">—</div>
          </div>
          <div class="field compact">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m15.6 15.6 4.4 4.4" stroke-linecap="round"/></svg>
            <input id="search" type="search" placeholder="Filter by line or destination" autocomplete="off" />
          </div>
          <div class="line-list" id="line-list"></div>
        </section>

        <footer class="side-note" id="data-note"></footer>
      </aside>

      <section class="map-wrap">
        <div id="map"></div>
        <div class="mode-bar" role="group" id="mode-group" aria-label="Choose transport types">
          <button type="button" class="mode-chip" data-mode="metro" aria-pressed="true"><i></i><span class="mode-name">T-bane</span><b class="mode-count"></b></button>
          <button type="button" class="mode-chip" data-mode="tram" aria-pressed="true"><i></i><span class="mode-name">Trikk</span><b class="mode-count"></b></button>
          <button type="button" class="mode-chip" data-mode="bus" aria-pressed="true"><i></i><span class="mode-name">Bus</span><b class="mode-count"></b></button>
          <button type="button" class="mode-chip" data-mode="boat" aria-pressed="true"><i></i><span class="mode-name">Boat</span><b class="mode-count"></b></button>
        </div>
        <div class="map-actions">
          <button class="icon-btn" id="locate" type="button" title="Share my location" aria-label="Share my location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg></button>
        </div>
        <div class="map-legend" id="map-legend"></div>
        <div class="vehicle-tip" id="vehicle-tip" hidden></div>
        <div class="toast" id="toast" role="status"></div>
      </section>
    </main>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="ruter-routes-01-01.js?v=2"></script>
  <script src="ruter-routes-01-02.js?v=2"></script>
  <script src="ruter-routes-01-03.js?v=2"></script>
  <script src="ruter-routes-01-04.js?v=2"></script>
  <script src="ruter-routes-01-05.js?v=2"></script>
  <script src="ruter-routes-01-06.js?v=2"></script>
  <script src="ruter-routes-01-07.js?v=2"></script>
  <script src="ruter-routes-01-08.js?v=2"></script>
  <script src="ruter-routes-01-09.js?v=2"></script>
  <script src="ruter-routes-01-10.js?v=2"></script>
  <script src="ruter-routes-02.js?v=2"></script>
  <script src="ruter-routes-03.js?v=2"></script>
  <script src="ruter-routes-04.js?v=2"></script>
  <script src="ruter-routes-05.js?v=2"></script>
  <script src="ruter-routes-06.js?v=2"></script>
  <script src="ruter-routes-07.js?v=2"></script>
  <script src="ruter-routes-08.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
